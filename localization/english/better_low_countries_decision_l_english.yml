 new_frisia_culture_requirement_tt:1 "All countries in the region of $custom_core_greater_frisia$ must be of the [GetCultureByKey('frisian').GetName] culture"
 better_low_countries_decisions.0003.t:0 "A New Frisian Kingdom"
 better_low_countries_decisions.0003.desc:0 "Centuries ago, we Frisians were driven from our ancestral homes in the Rhine Delta to northern lands. Even here however, we have managed to thrive. I have managed to form a new Frisian state all the way from the Rekere to Ribe, such that Frisians are once again fit to bear kingly dignity."
 better_low_countries_decisions.0003.a:0 "Eala Frya Fresena!"
 better_low_countries_decisions.0004.t:0 "Picard Nationhood"
 better_low_countries_decisions.0004.desc:0 "For centuries, we Picards have been assailed from foes from all sides, against which the French crown offered but little protection. Now however, I have managed to bring Picardy to an unprecendented age of power and prosperity, such we have now forced our neighbours to acknowledge us as their equal, befitting the rank of kingdom."
 better_low_countries_decisions.0004.a:0 "No strong bond ties me to the lily!"
 new_picardy_modifier:0 "Newfound Independence"
 new_picardy_modifier_desc:0 "This county prospers as part of Picardy's newfound independence."
 new_frisia_modifier:0 "Newfound Independence"
 new_frisia_modifier_desc:0 "This county prospers as part of the Frisian Sealands' newfound independence."