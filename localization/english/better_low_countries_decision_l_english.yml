 better_low_countries_decisions.0003.t:0 "A New Frisian Realm"
 better_low_countries_decisions.0003.desc:0 "For centuries, we Frisians have been subjugated by various petty nobles. But now, we have managed to thrive. From the Rekere to Ribe, the privileges given to us by Charlemagne have been restored, and I as the potestate of this new union will make sure that nobody will ever think of subjugating us again."
 better_low_countries_decisions.0003.a:0 "Eala Frya Fresena!"
 better_low_countries_decisions.0004.t:0 "Picard Nationhood"
 better_low_countries_decisions.0004.desc:0 "For centuries, we Picards have been assailed from foes from all sides, against which the French crown offered but little protection. Now however, I have managed to bring Picardy to an unprecendented age of power and prosperity, such we have now forced our neighbours to acknowledge us as their equal, befitting the rank of kingdom."
 better_low_countries_decisions.0004.a:0 "No strong bond ties me to the lily!"
 better_low_countries_decisions.0005.t:0 "Saxony Restored"
 better_low_countries_decisions.0005.desc:0 "Once destroyed by Charlemagne, who forcibly Christianized the region after executing thousands of prisoners, the rights of Old Saxony have now been restored a strong pagan ruler."
 better_low_countries_decisions.0005.a:0 "Hwæt!" 
 better_low_countries_decisions.0006.t:0 "An Independent Saxony"
 better_low_countries_decisions.0006.desc:0 "Ever since the conquests of Charlemagne, we Saxons have been subject to the Empire and its successors. Now however, that time has come to an end. From this day forward, we Saxons will once again face history as an independent nation."
 better_low_countries_decisions.0006.a:0 "Widukind, you have been avenged!"
 better_low_countries_decisions.0007.t:0 "Frisia and Lotharingia United"
 better_low_countries_decisions.0007.desc:0 "The precarious hold of Lotharingia over its Frisian periphery has finally stabilized, and its ruler has now taken the unprecedented decision to merge the two kingdoms into one."
 better_low_countries_decisions.0007.a:0 "This is outrageous!"
 better_low_countries_decisions.0007.b:0 "Oh well, what's for supper?"
