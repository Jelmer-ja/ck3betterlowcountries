 form_new_saxony_kingdom_decision_confirm:0 "Revenge for Widukind!"
 form_picardy_kingdom_decision_confirm:0 "Reveillez-vous, Picards!"
 restore_pagan_saxony_decision_confirm:0 "Revenge for Widukind!"
 form_netherlands_kingdom_decision_desc:0 "It would take a great effort, but perhaps an ambitious ruler could unite these quarrelsome Low Countries into a great realm."
 form_new_frisia_kingdom_decision_desc:0 "Years ago, Charlemagne granted us Frisians the privilege of having to pay fealty to no one but the emperor. How come then that we are still subject to these petty nobles? It is time that we carve out a realm for ourselves."
 form_picardy_kingdom_decision_desc:0 "For years, the Picards have contributed to the greatness of France, while receiving little in return by the way of protection and prosperity. It might be better if we forged our own path."
 form_new_saxony_kingdom_decision_desc:0 "Charlemagne's conquests and the following ruthless campaigns of pacification led to the end of an independent Saxony. But perhaps, under the auspices of a strong ruler, this venerable nation could be restored."
 restore_pagan_saxony_decision_desc:0 "Charlemagne's conquests and the following ruthless campaigns of pacification led to the end of an independent Saxony. But perhaps, under the auspices of a strong ruler, this venerable nation and its customs could be restored."
 form_netherlands_kingdom_decision_tooltip:0 "The Kingdom of the Netherlands will be founded."
 form_new_frisia_kingdom_decision_tooltip:0 "Frisia will be raised from a duchy to a kingdom, and the North Frisian counties will be unified into a duchy."
 form_picardy_kingdom_decision_tooltip:0 "Picardy will be raised from a duchy to a kingdom, and the Picard-speaking counties of Flanders and Brabant will be unified into a duchy."
 restore_pagan_saxony_decision_tooltip:0 "The Kingdom of Saxony will be restored"
 form_new_saxony_kingdom_decision_tooltip:0 "The Kingdom of Saxony will be founded"
 better_low_countries_decisions.0001.t:0 "The Kingdom of the Netherlands"
 better_low_countries_decisions.0001.desc:0 "For a long time, the lands at the mouth of the Rhine and Scheldt have been threatened by outside powers, but no more. After years of diplomatic wrangling and military action, I have managed to unite the notoriously stubborn and quarrelsome peoples of the Low Countries under a single banner."
 better_low_countries_decisions.0001.a:0 "Struggle and Emerge!"
 better_low_countries_decisions.0002.desc.emperor:0 "An ambitious noble has made himself the undisputed ruler of the Low Countries at the expense of my own authority! I should deal with this threat as soon as possible."
 better_low_countries_decisions.0002.desc.vassals:0 "A new entity known as the Kingdom of the Netherlands has risen in the Empire. \n\nAn independent force to be reckoned with, they have broken free from any prior claims to their lands, be it from the German lords to the east or the King of France to the south.\n\nI should look out for this new potential threat."
 better_low_countries_decisions.0002.a:0 "How peculiar..."
