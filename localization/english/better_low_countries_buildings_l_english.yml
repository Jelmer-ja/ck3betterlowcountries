l_english:
 building_type_notre_dame_amiens_01:1 "$building_notre_dame_amiens_01$"
 building_type_notre_dame_amiens_01_desc:0 "One of France's oldest and largest gothic cathedrals, with a volume of roughly 200.000 cubic metres. Its reliquary houses the alleged head of John the Baptist."
 building_notre_dame_amiens_01:0 "Our Lady of Amiens Cathedral"
 building_notre_dame_amiens_01_desc:0 "$building_type_notre_dame_amiens_01_desc$"
 building_notre_dame_amiens_destination_desc: "The majestic [GetBuilding('notre_dame_amiens_01').GetName], with its soaring spires and grand façade, is a masterpiece of Gothic architecture. Inside, the air resonates with the echoes of piety, each stained glass window and sculpture telling a sacred story."
 building_type_temple_of_nehalennia_01:1 "$building_temple_of_nehalennia_01$"
 building_type_temple_of_nehalennia_01_desc:0 "A temple to Nehalennia or Nertha, goddess of the sea. Once ruined or possibly destroyed on the orders of Saint Willibrord during the Christianization of the Low Countries, it has now been restored by a pious pagan ruler and once again attracts pilgrims from all over the area, anxious to pray for safe passage over the seas."
 building_temple_of_nehalennia_01_desc_01:0 "Temple of Nehalennia at Domburg"
 building_temple_of_nehalennia_01_desc:0 "$building_type_temple_of_nehalennia_01_desc$"
 building_temple_of_nehalennia_01_destination_desc: "The great Temple of Nehalennia at Domburg stands by the seaside, a row of pillars enclosing its rectangular inner sanctum. Inside, groups of worshipers supplicate before the statue of the goddess and pray for safe passage."
