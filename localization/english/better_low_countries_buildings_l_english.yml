 building_type_reims_cathedral_01_desc:0 "The Notre-Dame de Reims is the sacred cathedral and seat of the Archdiocese of Reims, renowned as the coronation site of the French kings. Within its hallowed halls, kings of the Franks receive their sacred anointing, binding their reigns to divine will."
 building_reims_cathedral_destination_desc:0 "The majestic [GetBuilding('building_reims_cathedral_01').GetName], with its soaring spires and grand façade, is a masterpiece of Gothic architecture. Inside, the air resonates with the echoes of piety, each stained glass window and sculpture telling a sacred story."
 building_type_saint_bavos_cathedral_01:0 "Saint Bavo's Cathedral"
 building_type_saint_bavos_cathedral_01_desc:0 "Saint Bavo's Cathedral in Ghent is a majestic Gothic cathedral dedicated to Saint Bavo, towering over the city with its intricate architecture and awe-inspiring presence. Its soaring spires reach towards the heavens, while its detailed stone carvings and stained glass windows tell stories of divine devotion and the city's rich religious history." 
 building_saint_bavos_cathedral_01:0 "Saint Bavo's Cathedral"
 building_saint_bavos_cathedral_01_desc:0 "Saint Bavo's Cathedral in Ghent is a majestic Gothic cathedral dedicated to Saint Bavo, towering over the city with its intricate architecture and awe-inspiring presence. Its soaring spires reach towards the heavens, while its detailed stone carvings and stained glass windows tell stories of divine devotion and the city's rich religious history." 
 building_saint_bavos_cathedral_destination_desc:0 "Saint Bavo's Cathedral in Ghent is a majestic Gothic cathedral dedicated to Saint Bavo, towering over the city with its intricate architecture and awe-inspiring presence. Its soaring spires reach towards the heavens, while its detailed stone carvings and stained glass windows tell stories of divine devotion and the city's rich religious history."
 building_antwerp_cathedral_01:0 "Cathedral of Our Lady of Antwerp"
 building_antwerp_cathedral_01_desc:0 "The largest church ever constructed in the Netherlands; and one of the largest in Europe; it is a symbol of the city's wealth, grandeur, might, piety and devotion to God."
 building_type_antwerp_cathedral_01:0 "Cathedral of Our Lady of Antwerp"
 building_type_antwerp_cathedral_01_desc:0 "The largest church ever constructed in the Netherlands; and one of the largest in Europe; it is a symbol of the city's wealth, grandeur, might, piety and devotion to God."
 building_antwerp_cathedral_destination_desc:0 "The Cathedral of Our Lady of Antwerp is a majestic Gothic cathedral dedicated to the Virgin Mary, towering over the city with its intricate architecture and awe-inspiring presence. Its soaring spires reach towards the heavens, while its detailed stone carvings and stained glass windows tell stories of divine devotion and the city's rich religious history."
 NOT_holy_site_germanic_or_holy_site_trigger:0 "The holder must be Asatru or another Germanic religion"
 building_type_upstalsboom_01:1 "$building_upstalsboom_01$"
 building_type_upstalsboom_01_desc:0 "Once a gravesite for the most important Frisian families, Upstalsboom later became the site for the yearly assembly of the emissaries from all the Frisian lands, where they would administer justice and coordinate common action against outside threats."
 building_upstalsboom_01:0 "Upstalsboom"
 building_upstalsboom_01_desc:0 "Once a gravesite for the most important Frisian families, Upstalsboom later became the site for the yearly assembly of the emissaries from all the Frisian lands, where they would administer justice and coordinate common action against outside threats."
 building_upstalsboom_destination_desc:0 "The great gathering place of [GetBuilding('upstalsboom_01').GetName] stands quietly in the forest, waiting for the next assembly."
 building_type_munster_paulus_dom_01:1 "$building_munster_paulus_dom_01$"
 building_type_munster_paulus_dom_01_desc:0 "First inaugurated by Liudger in 805, the St.-Paulus-Dom of Münster is one of the largest churches in Saxony and was an important seat of ecclesiastical power in Westphalia during and after the conversion of the Saxons."
 building_munster_paulus_dom_01:0 "St.-Paulus-Dom"
 building_munster_paulus_dom_01_desc:0 "First inaugurated by Liudger in 805, the St.-Paulus-Dom of Münster is one of the largest churches in Saxony and was an important seat of ecclesiastical power in Westphalia during and after the conversion of the Saxons."
 building_munster_paulus_dom_destination_desc:0 "[GetBuilding('munster_paulus_dom_01').GetName] stands proudly in the middle of Münster, bearing witness to the efforts of many generations of missionaries and clergymen."
 building_type_liege_cathedral_01:1 "$building_liege_cathedral$"
 building_type_liege_cathedral_01_desc:0 "Established by Eraclus during the 10th century, the Cathedral of Liège is one of the largest and most impressive gothic cathedrals in the Low Countries and the seat of power of the Prince-Bishops of Liège."
 building_liege_cathedral_01:0 "Liège Cathedral"
 building_liege_cathedral_01_desc:0 "Established by Eraclus during the 10th century, the Cathedral of Liège is one of the largest and most impressive gothic cathedrals in the Low Countries and the seat of power of the Prince-Bishops of Liège."
 building_liege_cathedral_destination_desc:0 "The great gathering place of [GetBuilding('liege_cathedral').GetName] stands quietly in the forest, waiting for the next assembly."
 building_type_muche_01:1 "Muche"
 building_type_muche_01_desc:1 "A type of subterranean hideout common in Picardy, typically located under churches, into which the people could retreat with their livestock during the long periods of war on the surface."
 building_muche_01:1 "Storehouse"
 building_muche_01_desc:1 "The first known muches in Picardy were constructed during the viking raids of the ninth century. These were meant as temporary storehouses and not yet fit for human occupation."
 building_muche_02:1 "Small Muche"
 building_muche_02_desc:2 "As the population of the towns of Picardy grew, muches were gradually expanded over the centuries and took on more and more functions."
 building_muche_03:1 "Livestock Pens"
 building_muche_03_desc:1 "Several muches included spaces to keep livestock, which would otherwise have become prey to roaming and looting groups of soldiers during times of war."
 building_muche_04:1 "Living Quarters"
 building_muche_04_desc:1 "Eventually, muches were expanded to make them fit for short periods of human habitation, usually including one or two small rooms per family."
 building_muche_05:1 "Family Compounds"
 building_muche_05_desc:1 "Family rooms within the muches were supplied with water wells and special niches to make fire, both to keep the occupants warm and to create currents in the air for ventilation."
 building_muche_06:1 "Street Complexes"
 building_muche_06_desc:1 "The larger muches were able to accomodate so many families that it was necessary for them to order these rooms in regular patterns, creating the impression of underground 'streets' just as on the surface."
 building_muche_07:1 "Rock Chapel"
 building_muche_07_desc:1 "Many muches had a place of worship to serve the people's spiritual needs during the difficult times when the muche would be in use."
 building_muche_08:1 "Subterranean City"
 building_muche_08_desc:1 "Almost every aspect of surface life has now been reproduced underground. The inhabitants of the province sleep easy, knowing their lives and possessions will always have a redoubt in times of war."
 