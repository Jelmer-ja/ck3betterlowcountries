l_english:
 building_type_notre_dame_amiens_01:1 "$building_notre_dame_amiens_01$"
 building_type_notre_dame_amiens_01_desc:0 "One of France's oldest and largest gothic cathedrals, with a volume of roughly 200.000 cubic metres. Its reliquary houses the alleged head of John the Baptist."
 building_notre_dame_amiens_01:0 "Our Lady of Amiens Cathedral"
 building_notre_dame_amiens_01_desc:0 "$building_type_notre_dame_amiens_01_desc$"
 building_notre_dame_amiens_destination_desc:0 "The majestic [GetBuilding('notre_dame_amiens_01').GetName], with its soaring spires and grand façade, is a masterpiece of Gothic architecture. Inside, the air resonates with the echoes of piety, each stained glass window and sculpture telling a sacred story."
 building_type_temple_of_nehalennia_01:1 "$building_temple_of_nehalennia_01$"
 building_type_temple_of_nehalennia_01_desc:0 "A temple to Nehalennia or Nertha, goddess of the sea."
 building_temple_of_nehalennia_01:0 "Temple of Nehalennia at Domburg"
 building_temple_of_nehalennia_01_desc:0 "A temple to Nehalennia or Nertha, goddess of the sea. Once ruined or possibly destroyed on the orders of Saint Willibrord during the Christianization of the Low Countries, it has now been restored by a pious pagan ruler and once again attracts pilgrims from all over the area, anxious to pray for safe passage over the seas."
 building_temple_of_nehalennia_destination_desc:0 "The great [GetBuilding('temple_of_nehalennia_01').GetName] stands by the seaside, a row of pillars enclosing its rectangular inner sanctum. Inside, groups of worshipers supplicate before the statue of the goddess and pray for safe passage."
 building_type_drenthe_megaliths_01:1 "$building_drenthe_megaliths_01$"
 building_type_drenthe_megaliths_01_desc:0 "A series of large stone grave sites dating back to the early neolithic, standing as a testament to the inhabitation of the land long before the earliest memories of its current occupants."
 building_drenthe_megaliths_01:0 "Hunebeds"
 building_drenthe_megaliths_01_desc:0 "$building_type_drenthe_megaliths_01_desc$"
 building_drenthe_megaliths_destination_desc:0 "The [GetBuilding('drenthe_megaliths_01').GetName] stand silently in the cold morning, indifferent to their late-born onlookers."
 building_type_ypres_cloth_hall_01:0 "Cloth Hall of Yperen"
 building_type_ypres_cloth_hall_01_desc:0 "The Cloth Hall of Ypres is the monumental cloth hall of the city of Ypres, a stunning example of Gothic architecture. Serving as the bustling center for the city's wool trade, this grand building, among the largest in all Europe, is a testament to the prosperity and wealth of Ypres and Flanders. The hall not only functions as a center of commerce but also as a seat of civic power, embodying the thriving life of this Flemish city at the crossroads of European trade."
 building_ypres_cloth_hall_01:0 "Cloth Hall of Yperen"
 building_ypres_cloth_hall_01_desc:0 "The Cloth Hall of Ypres is the monumental cloth hall of the city of Ypres, a stunning example of Gothic architecture. Serving as the bustling center for the city's wool trade, this grand building, among the largest in all Europe, is a testament to the prosperity and wealth of Ypres and Flanders. The hall not only functions as a center of commerce but also as a seat of civic power, embodying the thriving life of this Flemish city at the crossroads of European trade."
 building_ypres_cloth_hall_destination_desc:0 "The frenzy of activity in the Cloth Hall of Ypres astonishes you."
 building_type_st_donatians_church_01:0 "Saint Donatian's Church"
 building_type_st_donatians_church_01_desc:0 "Saint Donation's Church is the comital church of the Counts of Flanders, it was built originally by Count Arnulf I, but was expanded and modified in later centuries."
 building_st_donatians_church_01_desc:0 "Saint Donation's Church is the comital church of the Counts of Flanders, it was built originally by Count Arnulf I, but was expanded and modified in later centuries."
 building_st_donatians_church_01:0 "Saint Donatian's Church"
 building_st_donations_church_destination_desc:0 "Small but richly decorated, St Donatian's church stands as a testament to the private piety of the Counts of Flanders."
 building_type_utrecht_cathedral_01:0 "Saint Martin's Cathedral"
 building_type_utrecht_cathedral_01_desc:0 "The Saint Martin's Cathedral in Utrecht is the oldest cathedral in the Northern Netherlands, a proud symbol of the city's spiritual significance. This Romanesque church, with its sturdy stone walls and simple yet imposing design, stands as a testament to the enduring faith of Utrecht's people. As the center of ecclesiastical life in Utrecht, the cathedral holds a sacred place in the hearts of the faithful, representing both the city's history and its pivotal role in the Christian world of the north." 
 building_utrecht_cathedral_01:0 "Saint Martin's Cathedral"
 building_utrecht_cathedral_01_desc:0 "The Saint Martin's Cathedral in Utrecht is the oldest cathedral in the Northern Netherlands, a proud symbol of the city's spiritual significance. This Romanesque church, with its sturdy stone walls and simple yet imposing design, stands as a testament to the enduring faith of Utrecht's people. As the center of ecclesiastical life in Utrecht, the cathedral holds a sacred place in the hearts of the faithful, representing both the city's history and its pivotal role in the Christian world of the north."
 building_utrecht_cathedral_destination_desc:0 "The majestic [GetBuilding('building_utrecht_cathedral_01').GetName], with its soaring spires and grand façade, is a masterpiece of Gothic architecture. Inside, the air resonates with the echoes of piety, each stained glass window and sculpture telling a sacred story."
 building_type_koudenberg_palace_01:0 "Koudenberg Palace"
 building_type_koudenberg_palace_01_desc:0 "The Koudenberg Castle is a sturdy yet unassuming fortress, built by the Counts of Leuven as both a noble residence and a bastion against invaders. Constructed atop the hill overlooking Brussels, its thick stone walls and narrow towers provide security, while its modest halls serve as the heart of the county's governance. Though lacking in grandeur, it is a testament to the ambition of the lords who dwell within, a stronghold from which the rulers of Brabant may one day dream of greater things."
 building_koudenberg_palace_01:0 "Koudenberg Castle"
 building_koudenberg_palace_01_desc:0 "The Koudenberg Castle is a sturdy yet unassuming fortress, built by the Counts of Leuven as both a noble residence and a bastion against invaders. Constructed atop the hill overlooking Brussels, its thick stone walls and narrow towers provide security, while its modest halls serve as the heart of the county's governance. Though lacking in grandeur, it is a testament to the ambition of the lords who dwell within, a stronghold from which the rulers of Brabant may one day dream of greater things." 
 building_koudenberg_palace_destination_desc:0 "Koudenberg Castle stands cold and imposing over a hill overlooking the city of Brussels."
 building_chartres_cathedral_01:0 "Notre-Dame de Chartres"
 building_chartres_cathedral_01_desc:0 "The Notre-Dame de Chartres is the seat of the diocese of Chartres and commonly considered one of the world's most beautiful Gothic cathedrals."
 building_type_chartres_cathedral_01:0 "Notre-Dame de Chartres"
 building_type_chartres_cathedral_01_desc:0 "The Notre-Dame de Chartres is the seat of the diocese of Chartres and commonly considered one of the world's most beautiful Gothic cathedrals."
 building_chartres_cathedral_destination_desc:0 "The majestic [GetBuilding('building_chartres_cathedral_01').GetName], with its soaring spires and grand façade, is a masterpiece of Gothic architecture. Inside, the air resonates with the echoes of piety, each stained glass window and sculpture telling a sacred story."
 building_reims_cathedral_01:0 "Notre-Dame de Reims"
 building_reims_cathedral_01_desc:0 "The Notre-Dame de Reims is the sacred cathedral and seat of the Archdiocese of Reims, renowned as the coronation site of the French kings. Within its hallowed halls, kings of the Franks receive their sacred anointing, binding their reigns to divine will."
