l_english:
 form_netherlands_kingdom_decision:0 "Form the Lordship of the Netherlands"
 form_netherlands_kingdom_decision_confirm:0 "Our claims cannot be denied!"
 form_netherlands_kingdom_decision_desc:0 "If all the Low Countries are brought together, the Empire will have to recognize their claim as a unified state."
 form_netherlands_kingdom_decision_tooltip:0 "The Lordship of the Netherlands will be founded."
 form_netherlands_kingdom_decision_effect_tooltip:1 "If you [completely_control|E] the [d_frisia.GetName], it will become part of [k_netherlands.GetName]"
 better_low_countries_decisions.0001.t:0 "The Lordship of the Netherlands"
 better_low_countries_decisions.0001.desc:0 "For a long time, the lands at the mouth of the Rhine and Scheldt have been threatened by other actors inside the Empire. United under a single banner, they have now forged mutually beneficial alliances and have received the honor of imperial immediacy. \n\nIn honor of my dynasty's contributions to the Low Countries, I have been chosen as the head of this union. No longer will we be threatened by outsiders, but instead rise as a strong independent actor in the Empire."
 better_low_countries_decisions.0001.a:0 "Struggle and Emerge!"
 better_low_countries_decisions.0002.desc.emperor:0 "After years of strife and uneasy diplomatic deals, I was forced to grant the Low Countries imperial immediacy.\n\nThis collection of western domains has unified into a large state to protect themselves from the predations of the French king and German lords. I must be careful to keep them in check, lest their accomplishment sow dissent amongst the neighboring burghers."
 better_low_countries_decisions.0002.desc.vassals:0 "A new entity known as the Lordship of the Netherlands has risen in the Empire. \n\nAn independent force to be reckoned with, they have broken free from any prior claims to their lands, be it from the German lords to the east or the King of France to the south.\n\nI should look out for this new potential threat."
 better_low_countries_decisions.0002.a:0 "How peculiar..."
 custom_core_netherlands:0 "the Low Countries"